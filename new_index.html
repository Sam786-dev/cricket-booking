<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Cricket Turf Booking</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      background:#f4f7fb;
      padding:30px;
    }

    .box{
      max-width:500px;
      margin:auto;
      background:white;
      padding:25px;
      border-radius:15px;
      box-shadow:0 0 15px rgba(0,0,0,0.1);
    }

    h1{
      text-align:center;
      color:green;
      margin-bottom:20px;
    }

    input,
    select,
    button{
      width:100%;
      padding:14px;
      margin-top:12px;
      border-radius:8px;
      border:1px solid #ccc;
      font-size:16px;
    }

    button{
      background:green;
      color:white;
      border:none;
      cursor:pointer;
      font-size:18px;
    }

    button:hover{
      background:darkgreen;
    }

    .summary{
      margin-top:20px;
      background:#eef9ee;
      padding:15px;
      border-radius:10px;
      display:none;
    }

    .summary h3{
      color:green;
      margin-bottom:10px;
    }

  </style>

</head>

<body>

  <div class="box">

    <h1>🏏 Turf Booking</h1>

    <!-- NAME -->

    <input
      type="text"
      id="name"
      placeholder="Enter Full Name"
      required
    >

    <!-- PHONE -->

    <input
      type="tel"
      id="phone"
      placeholder="Enter Phone Number"
      required
    >

    <!-- TURF -->

    <select id="turf">

      <option>Green Field Turf</option>

      <option>Champion Turf</option>

      <option>Royal Cricket Arena</option>

    </select>

    <!-- DATE -->

    <input
      type="date"
      id="date"
      required
    >

    <!-- START TIME -->
    <!-- CLOCK TIME PICKER -->

    <input
      type="time"
      id="startTime"
      required
      step="1800"
    >

    <!-- END TIME -->
    <!-- CLOCK TIME PICKER -->

    <input
      type="time"
      id="endTime"
      required
      step="1800"
    >

    <!-- BUTTON -->

    <button onclick="bookNow()">
      Book Now
    </button>



    <!-- SUMMARY -->

    <div
      class="summary"
      id="summary"
    >

      <h3>Booking Summary</h3>

      <p>
        <strong>Name:</strong>
        <span id="sName"></span>
      </p>

      <p>
        <strong>Phone:</strong>
        <span id="sPhone"></span>
      </p>

      <p>
        <strong>Turf:</strong>
        <span id="sTurf"></span>
      </p>

      <p>
        <strong>Date:</strong>
        <span id="sDate"></span>
      </p>

      <p>
        <strong>Time:</strong>
        <span id="sTime"></span>
      </p>

    </div>

  </div>



  <script>

    // SET MINIMUM DATE = TODAY

    const today =
    new Date().toISOString().split("T")[0];

    document.getElementById("date").min =
    today;



    function bookNow(){

      // GET VALUES

      const name =
      document.getElementById("name").value.trim();

      const phone =
      document.getElementById("phone").value.trim();

      const turf =
      document.getElementById("turf").value;

      const date =
      document.getElementById("date").value;

      const startTime =
      document.getElementById("startTime").value;

      const endTime =
      document.getElementById("endTime").value;



      // CHECK EMPTY FIELDS

      if(
        !name ||
        !phone ||
        !date ||
        !startTime ||
        !endTime
      ){

        alert(
          "Please fill all fields"
        );

        return;

      }



      // PHONE VALIDATION

      const phonePattern =
      /^(\+91)?[6-9]\d{9}$/;

      if(!phonePattern.test(phone)){

        alert(
          "Enter valid Indian phone number"
        );

        return;

      }



      // TIME VALIDATION

      const start =
      new Date(`2026-01-01T${startTime}`);

      const end =
      new Date(`2026-01-01T${endTime}`);

      if(end <= start){

        alert(
          "End time must be greater than start time"
        );

        return;

      }



      // SHOW SUMMARY

      document.getElementById(
        "summary"
      ).style.display = "block";



      document.getElementById(
        "sName"
      ).innerText = name;



      document.getElementById(
        "sPhone"
      ).innerText = phone;



      document.getElementById(
        "sTurf"
      ).innerText = turf;



      document.getElementById(
        "sDate"
      ).innerText = date;



      document.getElementById(
        "sTime"
      ).innerText =
      startTime + " to " + endTime;



      // YOUR WHATSAPP NUMBER

      const whatsappNumber =
      "919110427011";



      // MESSAGE

      const message =
`🏏 Cricket Turf Booking

Name: ${name}

Phone: ${phone}

Turf: ${turf}

Date: ${date}

Time: ${startTime} to ${endTime}`;



      // WHATSAPP URL

      const whatsappURL =
`https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`;



      // OPEN WHATSAPP

      window.location.href =
      whatsappURL;

    }

  </script>

</body>

</html>
