<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Cricket Turf Booking</title>

  <style>

    body{
      font-family:Arial;
      background:#f4f7fb;
      margin:0;
    }

    .hero{
      height:220px;
      background:url("https://images.unsplash.com/photo-1521412644187-c49fa049e84d?auto=format&fit=crop&w=1400&q=80")
      center/cover no-repeat;
      display:flex;
      align-items:center;
      justify-content:center;
      color:white;
      font-size:26px;
      font-weight:bold;
      text-shadow:2px 2px 8px rgba(0,0,0,0.7);
    }

    .box{
      max-width:600px;
      margin:-40px auto 40px auto;
      background:white;
      padding:25px;
      border-radius:15px;
      box-shadow:0 0 15px rgba(0,0,0,0.1);
    }

    h2{
      text-align:center;
      color:green;
    }

    label{
      display:block;
      margin-top:12px;
      font-weight:bold;
    }

    input{
      width:100%;
      padding:12px;
      margin-top:6px;
      border-radius:8px;
      border:1px solid #ccc;
      font-size:16px;
    }

    .slots{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:10px;
      margin-top:10px;
    }

    .slot{
      padding:10px;
      text-align:center;
      border-radius:8px;
      border:1px solid #ccc;
      cursor:pointer;
      background:#f9f9f9;
      transition:0.2s;
    }

    .slot:hover{
      background:#e6ffe6;
    }

    .selected{
      background:green;
      color:white;
    }

    .booked{
      background:#ccc;
      cursor:not-allowed;
      pointer-events:none;
    }

    button{
      width:100%;
      padding:14px;
      margin-top:15px;
      border:none;
      border-radius:8px;
      background:green;
      color:white;
      font-size:18px;
      cursor:pointer;
    }

    button:hover{
      background:darkgreen;
    }

    .summary{
      margin-top:20px;
      background:#eef9ee;
      padding:15px;
      border-radius:10px;
      display:none;
    }

  </style>

</head>

<body>

  <div class="hero">
    Cricket Turf Booking 🏏
  </div>

  <div class="box">

    <h2>Book Your Slot</h2>

    <label>Full Name</label>
    <input type="text" id="name">

    <label>Phone Number</label>
    <input type="tel" id="phone">

    <label>Select Date</label>
    <input type="date" id="date">

    <label>Available Slots</label>

    <div class="slots" id="slotContainer"></div>

    <button onclick="bookNow()">Book Now</button>

    <div class="summary" id="summary">
      <h3>Booking Confirmed</h3>
      <p id="summaryText"></p>
    </div>

  </div>

  <script>

    // SAMPLE SLOTS
    const slots = [
      "06:00 - 07:00",
      "07:00 - 08:00",
      "08:00 - 09:00",
      "09:00 - 10:00",
      "10:00 - 11:00",
      "17:00 - 18:00",
      "18:00 - 19:00",
      "19:00 - 20:00"
    ];

    let selectedSlot = "";
    let bookedSlots = []; // memory (temporary)



    function renderSlots(){

      const container =
      document.getElementById("slotContainer");

      container.innerHTML = "";

      slots.forEach(slot => {

        const div =
        document.createElement("div");

        div.classList.add("slot");

        div.innerText = slot;



        if(bookedSlots.includes(slot)){
          div.classList.add("booked");
        }



        div.onclick = () => {

          document
          .querySelectorAll(".slot")
          .forEach(s => s.classList.remove("selected"));

          div.classList.add("selected");

          selectedSlot = slot;

        };



        container.appendChild(div);

      });

    }



    renderSlots();



    function bookNow(){

      let name =
      document.getElementById("name").value.trim();

      let phone =
      document.getElementById("phone").value.trim();

      let date =
      document.getElementById("date").value;



      if(!name || !phone || !date || !selectedSlot){
        alert("⚠️ Please fill all fields and select slot");
        return;
      }



      // MARK SLOT AS BOOKED
      bookedSlots.push(selectedSlot);

      renderSlots();



      // SHOW SUMMARY
      document.getElementById("summary").style.display = "block";

      document.getElementById("summaryText").innerText =
      `${name} booked slot ${selectedSlot} on ${date}`;



      // WHATSAPP
      const whatsappNumber =
      "919110427011";



      const message =
`🏏 Cricket Turf Booking

Name: ${name}
Phone: ${phone}
Date: ${date}
Slot: ${selectedSlot}`;



      const url =
`https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`;



      window.location.href = url;

    }

  </script>

</body>

</html>
