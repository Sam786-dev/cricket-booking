<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>PowerPlay Turf</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#f5f5f5;
      color:#222;
    }

    header{
      background:#0d1b2a;
      color:white;
      padding:20px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      flex-wrap:wrap;
    }

    header h1{
      font-size:30px;
    }

    nav a{
      color:white;
      text-decoration:none;
      margin:0 12px;
      font-size:16px;
      transition:0.3s;
    }

    nav a:hover{
      color:#00b4d8;
    }

    /* HERO SECTION */

    .hero{
      height:90vh;

      /* NEW CRICKET IMAGE */

      background:
      linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
      url('https://images.unsplash.com/photo-1625401586060-f12be3d7cc57?q=80&w=1400&auto=format&fit=crop');
      
      background-size:cover;
      background-position:center;

      display:flex;
      justify-content:center;
      align-items:center;
      text-align:center;
      color:white;
    }

    .hero-content{
      padding:40px;
      border-radius:10px;
    }

    .hero h2{
      font-size:48px;
      margin-bottom:15px;
    }

    .hero p{
      font-size:22px;
    }

    .btn{
      display:inline-block;
      margin-top:20px;
      padding:14px 28px;
      background:#00b4d8;
      color:white;
      text-decoration:none;
      border-radius:5px;
      font-size:18px;
      transition:0.3s;
    }

    .btn:hover{
      background:#0077b6;
    }

    section{
      padding:70px 20px;
    }

    .section-title{
      text-align:center;
      font-size:36px;
      margin-bottom:40px;
      color:#0d1b2a;
    }

    .booking-form{
      max-width:550px;
      margin:auto;
      background:white;
      padding:35px;
      border-radius:10px;
      box-shadow:0 5px 15px rgba(0,0,0,0.1);
    }

    .booking-form label{
      display:block;
      margin-bottom:8px;
      font-weight:bold;
      color:#0d1b2a;
      font-size:16px;
    }

    .booking-form input{
      width:100%;
      padding:14px;
      margin-bottom:22px;
      border:1px solid #ccc;
      border-radius:5px;
      font-size:16px;
      outline:none;
    }

    .booking-form input:focus{
      border-color:#00b4d8;
    }

    .booking-form button{
      width:100%;
      padding:15px;
      background:#0d1b2a;
      color:white;
      border:none;
      border-radius:5px;
      font-size:18px;
      cursor:pointer;
      transition:0.3s;
    }

    .booking-form button:hover{
      background:#0077b6;
    }

    .gallery{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(250px,1fr));
      gap:20px;
    }

    .gallery img{
      width:100%;
      height:260px;
      object-fit:cover;
      border-radius:10px;
      transition:0.3s;
    }

    .gallery img:hover{
      transform:scale(1.03);
    }

    .contact{
      background:#0d1b2a;
      color:white;
      text-align:center;
    }

    .contact h2{
      font-size:35px;
      margin-bottom:15px;
    }

    .contact p{
      font-size:18px;
      margin:10px 0;
    }

    .whatsapp{
      position:fixed;
      bottom:20px;
      right:20px;
      background:#25d366;
      color:white;
      width:60px;
      height:60px;
      border-radius:50%;
      text-align:center;
      line-height:60px;
      font-size:30px;
      text-decoration:none;
      box-shadow:0 5px 10px rgba(0,0,0,0.3);
      transition:0.3s;
    }

    .whatsapp:hover{
      background:#1ebe57;
      transform:scale(1.1);
    }

    @media(max-width:768px){

      .hero h2{
        font-size:34px;
      }

      .hero p{
        font-size:18px;
      }

      header{
        flex-direction:column;
        text-align:center;
      }

      nav{
        margin-top:12px;
      }

      nav a{
        display:inline-block;
        margin:8px;
      }

    }

  </style>

</head>

<body>

  <!-- HEADER -->

  <header>

    <h1>PowerPlay Turf</h1>

    <nav>
      <a href="#">Home</a>
      <a href="#booking">Booking</a>
      <a href="#gallery">Gallery</a>
      <a href="#contact">Contact</a>
    </nav>

  </header>

  <!-- HERO SECTION -->

  <section class="hero">

    <div class="hero-content">

      <h2>Premium Cricket Turf Booking</h2>

      <p>Book Your Cricket Slot Instantly</p>

      <a href="#booking" class="btn">
        Book Now
      </a>

    </div>

  </section>

  <!-- BOOKING SECTION -->

  <section id="booking">

    <h2 class="section-title">
      Turf Booking
    </h2>

    <div class="booking-form">

      <!-- NAME -->

      <label for="name">
        Full Name
      </label>

      <input
        type="text"
        id="name"
        placeholder="Enter your full name"
      >

      <!-- PHONE -->

      <label for="phone">
        Phone Number
      </label>

      <input
        type="tel"
        id="phone"
        placeholder="Enter your phone number"
      >

      <!-- DATE -->

      <label for="date">
        Booking Date
      </label>

      <input
        type="date"
        id="date"
      >

      <!-- START TIME -->

      <label for="startTime">
        Start Time
      </label>

      <input
        type="time"
        id="startTime"
      >

      <!-- END TIME -->

      <label for="endTime">
        End Time
      </label>

      <input
        type="time"
        id="endTime"
      >

      <!-- BUTTON -->

      <button onclick="saveBooking()">
        Confirm Booking
      </button>

    </div>

  </section>

  <!-- GALLERY SECTION -->

  <section id="gallery">

    <h2 class="section-title">
      Cricket Gallery
    </h2>

    <div class="gallery">

      <img
        src="https://images.unsplash.com/photo-1624526267942-ab0ff8a3e972?q=80&w=1200&auto=format&fit=crop"
        alt="Cricket Turf"
      >

      <img
        src="https://images.unsplash.com/photo-1540747913346-19e32dc3e97e?q=80&w=1200&auto=format&fit=crop"
        alt="Cricket Match"
      >

      <img
        src="https://images.unsplash.com/photo-1531415074968-036ba1b575da?q=80&w=1200&auto=format&fit=crop"
        alt="Cricket Stadium"
      >

      <img
        src="https://images.unsplash.com/photo-1512719994953-eabf50895df7?q=80&w=1200&auto=format&fit=crop"
        alt="Cricket Practice"
      >

    </div>

  </section>

  <!-- CONTACT SECTION -->

  <section class="contact" id="contact">

    <h2>Contact Us</h2>

    <p>📞 +91 9110427011</p>

    <p>📧 support@powerplayturf.com</p>

  </section>

  <!-- WHATSAPP BUTTON -->

  <a
    class="whatsapp"
    href="https://wa.me/919110427011"
    target="_blank"
  >
    💬
  </a>

  <!-- JAVASCRIPT -->

  <script>

    function saveBooking(){

      let name =
      document.getElementById("name").value;

      let phone =
      document.getElementById("phone").value;

      let date =
      document.getElementById("date").value;

      let startTime =
      document.getElementById("startTime").value;

      let endTime =
      document.getElementById("endTime").value;

      // VALIDATION

      if(
        name === "" ||
        phone === "" ||
        date === "" ||
        startTime === "" ||
        endTime === ""
      ){
        alert("Please fill all fields");
        return;
      }

      // CHECK TIME

      if(startTime >= endTime){
        alert("End time must be greater than start time");
        return;
      }

      // SUCCESS MESSAGE

      alert(
        "✅ Booking Confirmed!\n\n" +
        "Name: " + name +
        "\nPhone: " + phone +
        "\nDate: " + date +
        "\nStart Time: " + startTime +
        "\nEnd Time: " + endTime
      );

      // CLEAR FORM

      document.getElementById("name").value = "";
      document.getElementById("phone").value = "";
      document.getElementById("date").value = "";
      document.getElementById("startTime").value = "";
      document.getElementById("endTime").value = "";

    }

  </script>

</body>
</html>
